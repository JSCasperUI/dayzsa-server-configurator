<div class="fragment_container">
    <div class="fc_header">
        <div class="fts_block">
            <i class="fts_icon" id="icon"></i>
            <i class="fts_arrow" id="icon_arrow"></i>
        </div>
        <div class="fts_title">Редактирование типа</div>
    </div>
    <div class="fc_content scrollable">
        <div class="form_content">
            <GroupBlock title="Основные свойства">
                <div class="grid_blocks">

                    <div class="form_input_block">
                        <label class="input_label tooltip" aria-label="Name">Name</label>
                        <input id="edit_name" class="input_v"/>
                    </div>

                    <div class="form_input_block">
                        <label class="input_label tooltip"
                               aria-label="Determines the maximum number of an item">Nominal</label>
                        <input id="edit_nominal" type="number" min="-1" max="999999" class="input_v"/>
                    </div>

                    <div class="form_input_block">
                        <label class="input_label tooltip" aria-label="">Life Time</label>
                        <input id="edit_lifetime" type="number" min="-1" max="999999" class="input_v"/>
                    </div>
                    <div class="form_input_block">
                        <label class="input_label tooltip" aria-label="">Restock</label>
                        <input id="edit_restock" type="number" min="-1" max="999999" class="input_v"/>
                    </div>
                    <div class="form_input_block">
                        <label class="input_label tooltip" aria-label="">min</label>
                        <input id="edit_min" type="number" min="-1" max="999999" class="input_v"/>
                    </div>
                    <div class="form_input_block">
                        <label class="input_label tooltip" aria-label="">Quant min</label>
                        <input id="edit_quantmin" type="number" min="-1" max="999999" class="input_v"/>
                    </div>
                    <div class="form_input_block">
                        <label class="input_label tooltip" aria-label="">Quant max</label>
                        <input id="edit_quantmax" type="number" min="-1" max="999999" class="input_v"/>
                    </div>
                    <div class="form_input_block">
                        <label class="input_label tooltip" type="number" min="-1" max="999999"
                               aria-label="">Cost</label>
                        <input id="edit_cost" class="input_v"/>
                    </div>
                    <div class="form_input_block">
                        <label class="input_label tooltip"
                               aria-label="Determines where the item is spawned depending on the group, in this example, in shelves">Tag</label>
                        <select id="edit_tag" class="input_v">

                        </select>
                    </div>
                    <div class="form_input_block">
                        <label class="input_label tooltip" aria-label="">Category</label>
                        <select id="edit_category" class="input_v">

                        </select>
                    </div>
                </div>

            </GroupBlock>
        </div>


        <div class="form_content">
            <GroupBlock title="Флаги">
                <div class="grid_blocks">
                    <div class="form_input_block">
                        <CheckBoxBlock id="cb_count_in_cargo" title="Count in cargo"></CheckBoxBlock>
                    </div>
                    <div class="form_input_block">
                        <CheckBoxBlock id="cb_count_in_hoarder" title="Count in hoarder"></CheckBoxBlock>
                    </div>
                    <div class="form_input_block">
                        <CheckBoxBlock id="cb_count_in_map" title="Count in map"></CheckBoxBlock>
                    </div>
                    <div class="form_input_block">
                        <CheckBoxBlock id="cb_count_in_player" title="Count in player"></CheckBoxBlock>
                    </div>
                    <div class="form_input_block">
                        <CheckBoxBlock id="cb_crafted" title="Crafted"></CheckBoxBlock>
                    </div>
                    <div class="form_input_block">
                        <CheckBoxBlock id="cb_deloot" title="Deloot"></CheckBoxBlock>
                    </div>

                </div>
            </GroupBlock>
        </div>
        <div class="form_content">
            <GroupBlock title="Value flags">
                <div class="grid_blocks" id="block_value_flags">

                </div>
            </GroupBlock>
        </div>
        <div class="form_content">
            <GroupBlock title="Usage flags">
                <div class="grid_blocks" id="block_usage_flags">
                </div>
            </GroupBlock>
        </div>

    </div>
</div>
